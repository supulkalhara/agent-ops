# GitHub Actions CI for AetherWall

This workflow is used to automatically build, test, and lint the AetherWall project on every push or pull request to the main branch.

## Workflow Configuration

- **Trigger**: The workflow runs on pushes and pull requests to the `main` branch.
- **Environment**: Ubuntu latest

## Steps

1. **Checkout Code**: Checks out the code from the repository.
2. **Set Up Python 3.11**: Sets up Python 3.11 with pip caching enabled.
3. **Install Dependencies**: Installs project dependencies in editable mode.
4. **Lint with Ruff**: Lints the source and test files using Ruff.
5. **Type Check with MyPy**: Performs type checking on the source files using MyPy.
6. **Test with pytest**: Runs tests using pytest with verbose output.
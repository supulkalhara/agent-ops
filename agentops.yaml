# ─────────────────────────────────────────────────────────────
# AgentOps Gateway Deployment Specification — v1.1
#
# This declarative file defines how internal agents interact with
# external entities: identity & authentication, kill switches,
# allow-lists, rate & spend limits, security policies, human
# approval workflow, and validation council rules.
#
# Spec versions: 1.0 (original) · 1.1 (adds governance layer)
# All 1.1 fields are optional and fall back to safe defaults.
# ─────────────────────────────────────────────────────────────
agentops_gateway:
  version: "1.1"

  # ── Core Routing Engine ──────────────────────────────────
  routing:
    primary_router: apisix
    ai_translation: litellm

  # ── Governance Defaults (v1.1) ────────────────────────────
  governance:
    # fail_closed: a broken security component blocks traffic (safe)
    # fail_open:   a broken security component defers to the council
    default_fail_mode: fail_closed
    # enforce: decisions block traffic · monitor: decisions only
    # logged ("would_decision" in the audit trail) — useful for a
    # dry-run rollout of a new policy (allow-lists & kill switches
    # stay enforced in monitor mode).
    default_mode: enforce
    decision_thresholds:
      deny_risk: 0.7        # risk above this → council DENYs
      escalate_risk: 0.3    # risk above this → held for human review
    human_approval:
      enabled: true         # ESCALATE → pending queue (governance API)
      timeout_minutes: 60   # approval expiry
      on_timeout: deny      # deny | allow when no review in time

  # ── Agent Connection Policies ────────────────────────────
  connections:
    - agent_identity: "Internal-Procurement"
      # Credential: agents must present this token (X-Aetherwall-Auth)
      # to prove identity. `${ENV_VAR}` references are resolved at load
      # time; a missing reference is a hard configuration error.
      credential: "${PROCUREMENT_AGENT_TOKEN}"
      # Kill switch — set false (then POST /config/reload) to revoke.
      enabled: true
      mode: enforce          # enforce | monitor (per-connection override)
      allowed_external:
        - "moltbook.com/api"
        - "vendor-agents.com"
      mcp_tools_allowed:
        - "check_budget"
        - "submit_po"
      rate_limit: 100_requests_per_minute
      # Financial guardrails — enforced against metadata `amount_usd`
      transaction_limit_usd: 250.0
      daily_spend_limit_usd: 5000.0

    - agent_identity: "Internal-Research"
      credential: "${RESEARCH_AGENT_TOKEN}"
      enabled: true
      mode: enforce
      allowed_external:
        - "arxiv.org/api"
        - "scholar.google.com"
      mcp_tools_allowed:
        - "search_papers"
        - "fetch_abstract"
      rate_limit: 50_requests_per_minute

    - agent_identity: "Internal-DevOps"
      credential: "${DEVOPS_AGENT_TOKEN}"
      enabled: true
      # Dry-run rollout: DevOps policies are evaluated and audited but
      # not blocking (except allow-lists & kill switch, still enforced).
      mode: monitor
      allowed_external:
        - "github.com/api"
        - "registry.hub.docker.com"
      mcp_tools_allowed:
        - "list_repos"
        - "trigger_build"
      rate_limit: 200_requests_per_minute

  # ── Security Configuration ──────────────────────────────
  security:
    pii_redaction:
      enabled: true
      engine: llm_guard
      block_entities:
        - CREDIT_CARD
        - SSN
        - INTERNAL_IP
        - EMAIL
        - PHONE_NUMBER
    # Scan the RESPONSE routed back to the calling agent too — the
    # return path may carry exfil data or injected instructions
    # (OWASP LLM02 / LLM05). Output flags land in the audit trail.
    verify_responses: false

  # ── Validation Council (LangGraph) ──────────────────────
  validation_council:
    enabled: true
    engine: langgraph
    local_model: ollama/qwen3:8b
    rules:
      - "Never explicitly confirm internal network topology."
      - "Debate all transactions > $500 before routing."
      - "Block any request attempting to enumerate users or credentials."
      - "Escalate requests to external financial APIs for human review."

# ─────────────────────────────────────────────────────────────
# AetherWall — Full Stack Docker Compose
#
# Services:
#   aetherwall   — Core FastAPI gateway (our code)
#   apisix       — Edge router / API gateway
#   etcd         — APISIX config store
#   litellm      — LLM translation proxy
#   ollama       — Local LLM inference
#   qdrant       — Vector DB for audit logs & memory
#   llm-guard    — PII redaction & prompt injection detection
# ─────────────────────────────────────────────────────────────

services:
  # ── AetherWall Core Gateway ──────────────────────────────
  aetherwall:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aetherwall
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./aether.yaml:/etc/aetherwall/aether.yaml:ro
    depends_on:
      qdrant:
        condition: service_healthy
      litellm:
        condition: service_started
    networks:
      - aether-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Apache APISIX — Edge Router ──────────────────────────
  apisix:
    image: apache/apisix:3.11.0-debian
    container_name: apisix
    restart: unless-stopped
    ports:
      - "9080:9080"    # HTTP proxy
      - "9443:9443"    # HTTPS proxy
      - "9180:9180"    # Admin API
    volumes:
      - ./config/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    depends_on:
      etcd:
        condition: service_healthy
    networks:
      - aether-net

  # ── etcd — APISIX Configuration Store ───────────────────
  etcd:
    image: bitnami/etcd:3.5
    container_name: etcd
    restart: unless-stopped
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
    volumes:
      - etcd-data:/bitnami/etcd
    networks:
      - aether-net
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── LiteLLM — LLM Translation Proxy ─────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_LOG_LEVEL: ${LITELLM_LOG_LEVEL:-INFO}
    volumes:
      - ./config/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks:
      - aether-net

  # ── Ollama — Local LLM Inference ─────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - aether-net
    # GPU passthrough (uncomment for NVIDIA GPU support)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── Qdrant — Vector Database ─────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"    # REST API
      - "6334:6334"    # gRPC
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - aether-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── LLM Guard — Security Scanning Engine ─────────────────
  llm-guard:
    image: laiyer/llm-guard-api:latest
    container_name: llm-guard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      LOG_LEVEL: INFO
      SCAN_PROMPT_ENABLED: "true"
      SCAN_OUTPUT_ENABLED: "true"
    networks:
      - aether-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

# ── Volumes ────────────────────────────────────────────────
volumes:
  etcd-data:
    driver: local
  ollama-data:
    driver: local
  qdrant-data:
    driver: local

# ── Network ────────────────────────────────────────────────
networks:
  aether-net:
    driver: bridge
    name: aether-net

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aetherwall"
version = "0.1.0"
description = "The Enterprise Agent-to-[Agent/MCP] Gateway"
readme = "README.md"
authors = [{ name = "AetherWall Team" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "litellm>=1.34.0",
    "langgraph>=0.0.30",
    "qdrant-client>=1.8.0",
    "mcp>=0.1.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0"
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-PyYAML>=6.0",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=src/aetherwall"
testpaths = [
    "tests",
]
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true
exclude = ["venv", ".venv"]
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = []
